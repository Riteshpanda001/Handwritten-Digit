<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="160" height="110">
  <defs>
    <!-- Ultra-vibrant Cyan to Blue Gradient -->
    <linearGradient id="hd-cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="60%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Electric Blue Gradient for D -->
    <linearGradient id="hd-d-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- White to Ice Cyan Gradient for Pen -->
    <linearGradient id="hd-pen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(5, 5)">
    <!-- Bold Script 'H' Stroke -->
    <path d="M 15 70 C 2 45 12 14 32 10 C 48 8 46 32 38 60 C 33 80 26 95 18 98 C 12 100 8 96 14 84 C 22 60 48 42 76 38 M 42 46 C 58 43 72 20 80 8"
          fill="none" stroke="url(#hd-cyan-blue)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />

    <!-- Stylus Pen Overlay -->
    <path d="M 62 8 L 76 -3 L 84 5 L 70 16 Z" fill="url(#hd-pen-grad)" />
    <path d="M 48 46 L 62 8 L 70 16 L 56 54 Z" fill="url(#hd-pen-grad)" />
    <polygon points="48,46 41,60 56,54" fill="#00F2FE" />
    <circle cx="43.5" cy="57" r="2" fill="#FFFFFF" />

    <!-- Bold 'D' Block with High Contrast Inner Border -->
    <path d="M 76 22 L 98 22 C 122 22 136 36 136 55 C 136 74 122 88 98 88 L 76 88 Z" fill="url(#hd-d-grad)" />
    <path d="M 90 36 L 96 36 C 108 36 116 43 116 55 C 116 67 108 74 96 74 L 90 74 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />

    <!-- Bright Neon Dispersing Pixels -->
    <rect x="139" y="24" width="7" height="7" rx="1.5" fill="#00F2FE" />
    <rect x="149" y="34" width="8" height="8" rx="2" fill="#38BDF8" />
    <rect x="140" y="47" width="5" height="5" rx="1" fill="#22D3EE" />
    <rect x="150" y="57" width="7" height="7" rx="1.5" fill="#00F2FE" />
    <rect x="140" y="70" width="6" height="6" rx="1.5" fill="#3B82F6" />
    <rect x="149" y="80" width="6" height="6" rx="1.5" fill="#38BDF8" />
  </g>
</svg>
